services:
  # Web Service (Django API)
  - type: web
    name: restaurantbe-api
    runtime: image
    image:
      url: ghcr.io/duyaivy/restaurantbe:release
      # Private GHCR: add credentials in Render, then uncomment:
      # creds:
      #   fromRegistryCreds:
      #     name: ghcr-read
    # Persistent disks require paid compute. No account changes until applied.
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /health/
    disk:
      name: chroma-data
      mountPath: /var/data/chroma
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: restaurantBE.settings.production
      - key: ENV
        value: prod
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LOG_LEVEL
        value: "info"
      - key: DJANGO_DB_LOG_LEVEL
        value: "WARNING"
      - key: DJANGO_CACHE_TIMEOUT_DEFAULT
        value: "3600"
      - key: SECRET_KEY
        generateValue: true

      # Database (Supabase PostgreSQL Connection URL)
      - key: DATABASE_URL
        sync: false

      # Redis Cache & Socket.IO (Cloud Redis)
      - key: REDIS_URL
        sync: false

      # Hosts & URLs
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: HOST
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Cloudinary Media Storage
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Chatbot LLM (Groq / Gemini)
      - key: CHATBOT_LLM_PROVIDER
        value: "groq"
      - key: CHATBOT_LLM_MODEL
        value: "llama-3.1-8b-instant"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHATBOT_LLM_TEMPERATURE
        value: "0.2"
      - key: CHATBOT_LLM_MAX_TOKENS
        value: "800"
      - key: CHATBOT_LLM_REASONING_ENABLED
        value: "false"

      # Chatbot Embedding (Jina / Gemini / Local)
      - key: CHATBOT_EMBEDDING_PROVIDER
        value: "jina"
      - key: CHATBOT_EMBEDDING_MODEL
        value: "jina-embeddings-v3"
      - key: CHATBOT_EMBEDDING_DIMENSIONS
        value: "1024"
      - key: CHATBOT_EMBEDDING_API_KEY
        sync: false
      - key: CHATBOT_EMBEDDING_TIMEOUT_SECONDS
        value: "15"
      - key: CHATBOT_EMBEDDING_DEVICE
        value: "cpu"
      - key: CHATBOT_EMBEDDING_BATCH_SIZE
        value: "32"
      - key: CHATBOT_EMBEDDING_NORMALIZE
        value: "true"
      - key: CHATBOT_EMBEDDING_BASE_URL
        value: ""
      - key: CHATBOT_LLM_BASE_URL
        value: ""
      # Optional provider secrets: set in Dashboard only when used.
      # EMBEDDING_API_KEY, JINA_API_KEY, NVIDIA_API_KEY, OPENROUTER_API_KEY
      - key: CHATBOT_CHROMA_DIR
        value: "/var/data/chroma"
      - key: CHATBOT_CHROMA_COLLECTION
        value: "restaurant_chatbot"

      # Google Translation (Optional)
      - key: GOOGLE_TRANSLATION_ENABLED
        value: "true"
      - key: GOOGLE_TRANSLATION_PROJECT_ID
        sync: false
      - key: GOOGLE_TRANSLATION_LOCATION
        value: "global"
      - key: GOOGLE_CREDENTIALS_JSON_BASE64
        sync: false

      # VNPay Payment Gateway
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_PAYMENT_URL
        value: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      - key: VNPAY_RETURN_URL
        sync: false
      - key: VNPAY_ORDER_TYPE
        value: "18000"

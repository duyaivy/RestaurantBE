services:
  # Web Service (Django API)
  - type: web
    name: restaurantbe-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash build.sh
    healthCheckPath: /admin/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: restaurantBE.settings.production
      - key: ENV
        value: prod
      - key: SECRET_KEY
        generateValue: true
      # Supabase PostgreSQL Connection
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: HOST
        sync: false
      - key: CLIENT_URL
        sync: false
      # VNPay
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_PAYMENT_URL
        value: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      - key: VNPAY_RETURN_URL
        sync: false
      - key: VNPAY_ORDER_TYPE
        value: "18000"

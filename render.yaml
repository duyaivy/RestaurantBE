services:
  # Web Service (Django API)
  - type: web
    name: restaurantbe-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash build.sh
    healthCheckPath: /health/
    disk:
      name: chroma-data
      mountPath: /var/data/chroma
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: restaurantBE.settings.production
      - key: ENV
        value: prod
      - key: SECRET_KEY
        generateValue: true
      # Supabase PostgreSQL Connection
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: HOST
        sync: false
      - key: CLIENT_URL
        sync: false
      # Chatbot (OpenRouter + local Chroma)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHATBOT_LLM_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: CHATBOT_LLM_MODEL
        value: "nvidia/nemotron-3-super-120b-a12b:free"
      - key: CHATBOT_LLM_TEMPERATURE
        value: "0.2"
      - key: CHATBOT_LLM_REASONING_ENABLED
        value: "false"
      - key: CHATBOT_EMBEDDING_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: CHATBOT_EMBEDDING_MODEL
        value: "text-embedding-3-small"
      - key: CHATBOT_EMBEDDING_API_KEY
        sync: false
      - key: CHATBOT_CHROMA_DIR
        value: "/var/data/chroma"
      - key: CHATBOT_CHROMA_COLLECTION
        value: "restaurant_chatbot"
      # Google Translation
      - key: GOOGLE_TRANSLATION_ENABLED
        value: "true"
      - key: GOOGLE_TRANSLATION_PROJECT_ID
        sync: false
      - key: GOOGLE_TRANSLATION_LOCATION
        value: "global"
      - key: GOOGLE_CREDENTIALS_JSON_BASE64
        sync: false
      # VNPay
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_PAYMENT_URL
        value: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      - key: VNPAY_RETURN_URL
        sync: false
      - key: VNPAY_ORDER_TYPE
        value: "18000"

name: Build Docker and deploy Render

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Render (disable for first image build)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: render-release-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment inputs
        env:
          DEPLOY: ${{ github.event_name == 'push' || inputs.deploy }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          bash -n docker-entrypoint.sh
          if [ "$DEPLOY" = true ] && [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo 'Missing RENDER_DEPLOY_HOOK_URL. For bootstrap, run manually with deploy disabled.'
            exit 1
          fi
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: restaurantbe:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check application and persistence across containers
        run: |
          docker run --rm -v "$PWD/tests/deployment_smoke.py:/tmp/deployment_smoke.py:ro" restaurantbe:verify flake8 /tmp/deployment_smoke.py
          docker run --rm restaurantbe:verify python manage.py check
          docker run --rm restaurantbe:verify python manage.py collectstatic --noinput
          docker run --rm restaurantbe:verify python -c 'import torch; from sentence_transformers import SentenceTransformer; assert torch.version.cuda is None'
          data_dir=$(mktemp -d)
          for mode in write read; do
            docker run --rm \
              -e CHATBOT_CHROMA_DIR=/var/data/chroma \
              -e PYTHONPATH=/app \
              -v "$data_dir:/var/data/chroma" \
              -v "$PWD/tests/deployment_smoke.py:/tmp/deployment_smoke.py:ro" \
              restaurantbe:verify python /tmp/deployment_smoke.py "$mode"
          done
      - name: Publish verified image
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker tag restaurantbe:verify "$IMAGE:sha-$COMMIT_SHA"
          docker tag restaurantbe:verify "$IMAGE:release"
          docker push "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:release"
          repo_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:release")
          echo "digest=${repo_digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Request Render deploy of exact image digest
        if: github.event_name == 'push' || inputs.deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          if ! curl --fail --silent --output /dev/null \
            --max-time 60 --get --data-urlencode "imgURL=$IMAGE" \
            "$RENDER_DEPLOY_HOOK_URL"; then
            echo 'Render rejected the deploy request or could not be reached. Check hook and image-backed service configuration.'
            exit 1
          fi
          echo 'Render accepted the deploy request. Check deployment status and /health/ in Render.'
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          echo "Published image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8000
      - DJANGO_SETTINGS_MODULE=restaurantBE.settings.production
      - CHATBOT_CHROMA_DIR=/var/data/chroma
      - WEB_CONCURRENCY=1
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Mount code để live reload khi sửa code trên máy host
      - .:/app
      - /app/__pycache__
      # Giữ dữ liệu vector Chroma và staticfiles
      - chroma_data:/var/data/chroma
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  chroma_data:
  static_data:

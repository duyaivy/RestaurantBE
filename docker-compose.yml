services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8000}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Mount code để live reload khi sửa code trên máy host
      - .:/app
      - /app/__pycache__
      # Giữ dữ liệu vector Chroma và staticfiles
      - chroma_data:/app/restaurantBE/chatbot/rag/.chroma
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  chroma_data:
  static_data:
